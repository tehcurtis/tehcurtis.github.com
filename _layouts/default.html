<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/neighborhood.css" | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ "/assets/images/favicon.svg" | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ "/atom.xml" | relative_url }}">
{% seo %}
  </head>

  <body class="city-site{% if page.layout == "home" %} city-home{% endif %}">
<div class="city-backdrop" data-neighborhood aria-hidden="true">
  <img src="{{ '/assets/images/city-backdrop.png' | relative_url }}" alt="" width="1536" height="1024">
  <canvas width="1000" height="340"></canvas>
  <script type="application/json" data-scene-config>{{ site.data.neighborhood | jsonify }}</script>
</div>


    <a class="skip-link" href="#main">skip to content</a>

    <header class="site-nav">
      <a class="brand" href="{{ "/" | relative_url }}" aria-label="Home">
        <svg class="brand-mark" width="20" height="20" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="2" y="1" width="4" height="1" fill="#b6ff2e"/>
          <rect x="1" y="2" width="2" height="1" fill="#b6ff2e"/>
          <rect x="1" y="3" width="1" height="2" fill="#b6ff2e"/>
          <rect x="1" y="5" width="2" height="1" fill="#b6ff2e"/>
          <rect x="2" y="6" width="4" height="1" fill="#b6ff2e"/>
          <rect x="5" y="2" width="1" height="1" fill="#ff3d81"/>
          <rect x="5" y="5" width="1" height="1" fill="#ff3d81"/>
        </svg>
        <span class="brand-text">tehcurtis<span class="brand-cursor">_</span></span>
      </a>
      <nav class="nav-links" aria-label="Site">
        <a href="{{ "/" | relative_url }}">posts</a>
        <a href="{{ "/archive" | relative_url }}">archive</a>
        <a href="{{ "/about-me" | relative_url }}">about</a>
        <a href="https://github.com/{{ site.github_username }}" rel="me">github</a>
        <a href="{{ "/atom.xml" | relative_url }}">rss</a>
      </nav>
    </header>

    <main id="main" class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="skyline" role="img" aria-label="Pixel-art city skyline"></div>
      <div class="footer-bar">
        <span class="footer-id">tehcurtis &copy; {{ "now" | date: "%Y" }}</span>
        <span class="footer-tag">software &middot; architecture &middot; ai</span>
        <span class="footer-links">
          <a href="https://github.com/{{ site.github_username }}">github</a>
          <a href="https://www.linkedin.com/in/cedmond/">linkedin</a>
          <a href="{{ "/atom.xml" | relative_url }}">rss</a>
        </span>
      </div>
    </footer>
    <script src="{{ "/assets/js/neighborhood.js" | relative_url }}" defer></script>
  </body>
</html>
